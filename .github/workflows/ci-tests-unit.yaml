# Replay farm copy of upstream's ci-tests-unit.yaml: test CI only, read-only token, no secrets,
# no publish, deploy or comment steps. Generated by evals/scripts/replay-farm/overlay.ts; don't edit by hand.

# Description: Unit and component testing with Vitest + coverage reporting
name: 'CI: Tests Unit'

on:
  push:
    branches: [main, master, dev*, core/*, desktop/*]
  workflow_call: {}
  workflow_dispatch:

    # main pushes get their own group so every merge is measured; other refs
    # still supersede. The ref stays in the key so a release-branch push of the
    # same commit cannot cancel main's run.
  pull_request:
  merge_group:
    types:
      - checks_requested
concurrency:
  group: ${{ github.workflow }}-unit-${{ github.ref }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && github.sha || '' }}
  cancel-in-progress: true

jobs:
  jiffy-gate:
    name: Jiffy gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      run-all: ${{ steps.gate.outputs.run-all || 'true' }}
      tests: ${{ steps.gate.outputs.tests || '[]' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: rsyed94/jiffy@27fc5c2fdd33ad5d0ced231fbddb56155aaab5bd # action/v1
        id: gate
        continue-on-error: true
        with:
          service-url: https://jiffy-app-production.up.railway.app
          run-all: ${{ vars.JIFFY_RUN_ALL }}

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-run: ${{ steps.changes.outputs.should-run-unit }}
    steps:
      - uses: actions/checkout@v7
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm
      - id: changes
        uses: ./.github/actions/changes-filter

  test-shards:
    needs:
      - jiffy-gate
      - changes
    if: ${{ !cancelled() && (needs.changes.outputs.should-run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      JIFFY_RUN_ALL: ${{ needs.jiffy-gate.outputs.run-all || 'true' }}
      JIFFY_TESTS: ${{ needs.jiffy-gate.outputs.tests || '[]' }}
      JIFFY_RECORD: ${{ github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}

    steps:
      - uses: actions/checkout@v7
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
      - name: "Replay farm: fetch the PR base for Tensile"
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --quiet --depth=100 origin "$BASE" "$GITHUB_SHA"
          fi
      - name: Tensile selection (shadow)
        id: tensile
        uses: rsyed94/tensile-action@05313adc9733cfd37a2a1e5efc192a492bf6298b
        continue-on-error: true
        with:
          phase: select
          mode: shadow
          runner: vitest
          service-url: https://jiffy-app-production.up.railway.app
          check-run-id: ${{ job.check_run_id }}
          matrix-key: ${{ toJSON(matrix) }}
          shard: ${{ matrix.shard }}/${{ strategy.job-total }}
          test-step: Run Vitest tests with coverage
          report: .jiffy/no-report.json

      - name: Run Vitest tests with coverage
        env:
          VITEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: pnpm test:coverage --shard="$VITEST_SHARD" --reporter=default --reporter=blob

      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: unit-shard-${{ matrix.shard }}
          path: .vitest/blob/*.json
          include-hidden-files: true
          # 1-day retention expired before a next-day re-run of only the
          # failed jobs could download it, so test-report failed on a
          # missing artifact rather than a real test result (see the
          # matching unit-package-coverage comment below).
          retention-days: 7
          if-no-files-found: error
      - name: Keep Jiffy coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && env.JIFFY_RECORD == 'true' }}
        with:
          name: jiffy-coverage-${{ github.job }}-${{ strategy.job-index }}
          path: .jiffy/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - name: Keep test results for Jiffy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: jiffy-results-${{ github.job }}-${{ strategy.job-index }}
          path: .jiffy/results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
    permissions:
      contents: read
      id-token: write

  test-packages:
    needs:
      - jiffy-gate
      - changes
    if: ${{ !cancelled() && (needs.changes.outputs.should-run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      JIFFY_RUN_ALL: ${{ needs.jiffy-gate.outputs.run-all || 'true' }}
      JIFFY_TESTS: ${{ needs.jiffy-gate.outputs.tests || '[]' }}
      JIFFY_RECORD: ${{ github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    steps:
      - uses: actions/checkout@v7
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Run package unit tests with coverage
        run: |
          pnpm --recursive --no-sort --workspace-concurrency=2 --no-bail \
            --filter @comfyorg/account-core \
            --filter @comfyorg/account-ui \
            --filter @comfyorg/billing-contract \
            --filter @comfyorg/layer-editor \
            --filter @comfyorg/layer-editor-ui \
            --filter @comfyorg/mask-editor \
            --filter @comfyorg/object-info-parser \
            --filter @comfyorg/shared-frontend-utils \
            --filter @comfyorg/viewport3d \
            --filter @comfyorg/design-system \
            --filter @comfyorg/test-utils \
            exec vitest run --coverage --maxWorkers=3

      - name: Upload package coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: unit-package-coverage
          path: packages/*/coverage/lcov.info
          # test-report downloads this by name in the same run. A 1-day
          # retention does not survive "re-run failed jobs" clicked more
          # than a day later: test-packages keeps its original (already
          # expired) artifact, so test-report fails on a missing-artifact
          # error that has nothing to do with the PR under test (hit on
          # #22645 and #22507, run_attempt 3 and 2, both >24h after the
          # first attempt). 7 days matches ci-tests-e2e.yaml's
          # snapshot-updates artifacts, the existing precedent in this repo
          # for a short-lived artifact that must still survive a re-run.
          retention-days: 7
          if-no-files-found: error
      - name: Keep Jiffy coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && env.JIFFY_RECORD == 'true' }}
        with:
          name: jiffy-coverage-${{ github.job }}-${{ strategy.job-index }}
          path: .jiffy/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - name: Keep test results for Jiffy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: jiffy-results-${{ github.job }}-${{ strategy.job-index }}
          path: .jiffy/results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  test-report:
    needs:
      - jiffy-gate
      - test-shards
      - test-packages
    if: ${{ !cancelled() && needs.test-shards.result == 'success' && needs.test-packages.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JIFFY_RUN_ALL: ${{ needs.jiffy-gate.outputs.run-all || 'true' }}
      JIFFY_TESTS: ${{ needs.jiffy-gate.outputs.tests || '[]' }}
      JIFFY_RECORD: ${{ github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    steps:
      - uses: actions/checkout@v7
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Download shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: unit-shard-*
          path: .vitest/blob
          merge-multiple: true

      - name: Download package coverage
        uses: actions/download-artifact@v8
        with:
          name: unit-package-coverage
          path: packages

      - name: Merge reports and check coverage thresholds
        run: pnpm test:coverage --merge-reports=.vitest/blob

      - name: Upload unit coverage artifact
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: unit-coverage
          path: coverage/lcov.info
          retention-days: 30
          if-no-files-found: warn
      - name: Keep Jiffy coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && env.JIFFY_RECORD == 'true' }}
        with:
          name: jiffy-coverage-${{ github.job }}-${{ strategy.job-index }}
          path: .jiffy/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - name: Keep test results for Jiffy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: jiffy-results-${{ github.job }}-${{ strategy.job-index }}
          path: .jiffy/results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  test:
    if: ${{ always() }}
    needs: [changes, test-shards, test-packages, test-report]
    runs-on: ubuntu-latest
    steps:
      - name: Check unit test results
        env:
          CHANGES: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.should-run }}
          SHARDS: ${{ needs.test-shards.result }}
          PACKAGES: ${{ needs.test-packages.result }}
          REPORT: ${{ needs.test-report.result }}
        run: |
          echo "changes=$CHANGES should_run=$SHOULD_RUN shards=$SHARDS packages=$PACKAGES report=$REPORT"
          [[ "$CHANGES" == "success" ]] || exit 1
          if [[ "$SHOULD_RUN" == "false" ]]; then
            [[ "$SHARDS" == "skipped" && "$PACKAGES" == "skipped" && "$REPORT" == "skipped" ]]
          else
            [[ "$SHOULD_RUN" == "true" && "$SHARDS" == "success" && "$PACKAGES" == "success" && "$REPORT" == "success" ]]
          fi

  jiffy-upload:
    name: Jiffy coverage upload
    needs:
      - test-shards
      - test-packages
      - test-report
    if: ${{ !cancelled() && (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: jiffy-coverage-*
          path: jiffy-coverage
      - name: Upload coverage to Jiffy
        shell: bash
        env:
          JIFFY_SERVER: https://jiffy-app-production.up.railway.app
        run: |
          set -euo pipefail
          shopt -s nullglob
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=jiffy" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).value))')
          echo "::add-mask::$token"
          put() { curl -sSf -X PUT -H "Authorization: Bearer $token" -H "content-type: application/json" --data-binary @"$1" "$JIFFY_SERVER/v1/maps/$GITHUB_REPOSITORY/$GITHUB_SHA/$2/$3"; }
          for dir in jiffy-coverage/*/; do
            job=$(basename "$dir")
            for f in "$dir"coverage-*.json; do case "$f" in *-nodes.json | *-nodes.always-run.json) continue ;; esac; put "$f" parts "$job-$(basename "$f" .json)"; done
            for f in "$dir"report-*.json; do put "$f" durations "$job-$(basename "$f" .json)"; done
          done
permissions:
  contents: read
