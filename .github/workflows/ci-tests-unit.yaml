# Replay farm copy of upstream's ci-tests-unit.yaml: test CI only, read-only token, no secrets,
# no publish, deploy or comment steps. Generated by evals/scripts/replay-farm/overlay.ts; don't edit by hand.

# Description: Unit and component testing with Vitest + coverage reporting
name: 'CI: Tests Unit'

on:
  push:
    branches: [main, master, dev*, core/*, desktop/*]
  workflow_call: {}
  workflow_dispatch:

    # main pushes get their own group so every merge is measured; other refs
    # still supersede. The ref stays in the key so a release-branch push of the
    # same commit cannot cancel main's run.
  pull_request:
concurrency:
  group: ${{ github.workflow }}-unit-${{ github.ref }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && github.sha || '' }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-run: ${{ steps.changes.outputs.should-run-unit }}
    steps:
      - uses: actions/checkout@v7
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm
      - id: changes
        uses: ./.github/actions/changes-filter

  test-shards:
    needs:
      - changes
    if: ${{ needs.changes.outputs.should-run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@v7
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
      - name: "Replay farm: fetch the PR base for Tensile"
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --quiet --depth=100 origin "$BASE" "$GITHUB_SHA"
          fi
      - name: Tensile selection (shadow)
        id: tensile
        uses: rsyed94/tensile-action@bf465a2f8f66e7225ed32003c1661ee984aa33d3
        continue-on-error: true
        with:
          phase: select
          mode: shadow
          runner: vitest
          service-url: https://jiffy-app-production.up.railway.app
          check-run-id: ${{ job.check_run_id }}
          matrix-key: ${{ toJSON(matrix) }}
          test-step: Run Vitest tests with coverage
          report: .jiffy/no-report.json

      - name: Run Vitest tests with coverage
        env:
          VITEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: pnpm test:coverage --shard="$VITEST_SHARD" --reporter=default --reporter=blob

      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: unit-shard-${{ matrix.shard }}
          path: .vitest/blob/*.json
          include-hidden-files: true
          # 1-day retention expired before a next-day re-run of only the
          # failed jobs could download it, so test-report failed on a
          # missing artifact rather than a real test result (see the
          # matching unit-package-coverage comment below).
          retention-days: 7
          if-no-files-found: error
    permissions:
      contents: read
      id-token: write

  test-packages:
    needs:
      - changes
    if: ${{ needs.changes.outputs.should-run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Run package unit tests with coverage
        run: |
          pnpm --recursive --no-sort --workspace-concurrency=2 --no-bail \
            --filter @comfyorg/account-core \
            --filter @comfyorg/account-ui \
            --filter @comfyorg/billing-contract \
            --filter @comfyorg/layer-editor \
            --filter @comfyorg/mask-editor \
            --filter @comfyorg/object-info-parser \
            --filter @comfyorg/shared-frontend-utils \
            --filter @comfyorg/viewport3d \
            --filter @comfyorg/design-system \
            --filter @comfyorg/test-utils \
            exec vitest run --coverage --maxWorkers=3

      - name: Upload package coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: unit-package-coverage
          path: packages/*/coverage/lcov.info
          # test-report downloads this by name in the same run. A 1-day
          # retention does not survive "re-run failed jobs" clicked more
          # than a day later: test-packages keeps its original (already
          # expired) artifact, so test-report fails on a missing-artifact
          # error that has nothing to do with the PR under test (hit on
          # #22645 and #22507, run_attempt 3 and 2, both >24h after the
          # first attempt). 7 days matches ci-tests-e2e.yaml's
          # snapshot-updates artifacts, the existing precedent in this repo
          # for a short-lived artifact that must still survive a re-run.
          retention-days: 7
          if-no-files-found: error

  test-report:
    needs: [test-shards, test-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Download shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: unit-shard-*
          path: .vitest/blob
          merge-multiple: true

      - name: Download package coverage
        uses: actions/download-artifact@v8
        with:
          name: unit-package-coverage
          path: packages

      - name: Merge reports and check coverage thresholds
        run: pnpm test:coverage --merge-reports=.vitest/blob

      - name: Upload unit coverage artifact
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: unit-coverage
          path: coverage/lcov.info
          retention-days: 30
          if-no-files-found: warn

  test:
    if: ${{ always() }}
    needs: [changes, test-shards, test-packages, test-report]
    runs-on: ubuntu-latest
    steps:
      - name: Check unit test results
        env:
          CHANGES: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.should-run }}
          SHARDS: ${{ needs.test-shards.result }}
          PACKAGES: ${{ needs.test-packages.result }}
          REPORT: ${{ needs.test-report.result }}
        run: |
          echo "changes=$CHANGES should_run=$SHOULD_RUN shards=$SHARDS packages=$PACKAGES report=$REPORT"
          [[ "$CHANGES" == "success" ]] || exit 1
          if [[ "$SHOULD_RUN" == "false" ]]; then
            [[ "$SHARDS" == "skipped" && "$PACKAGES" == "skipped" && "$REPORT" == "skipped" ]]
          else
            [[ "$SHOULD_RUN" == "true" && "$SHARDS" == "success" && "$PACKAGES" == "success" && "$REPORT" == "success" ]]
          fi
permissions:
  contents: read
